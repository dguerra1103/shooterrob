# Construye el juego con Rojo y lo publica en Roblox en cada push.
# Configúralo una vez en GitHub > Settings > Secrets and variables > Actions:
#   Secret:    ROBLOX_API_KEY
#   Variables: ROBLOX_UNIVERSE_ID, ROBLOX_PLACE_ID
# Mientras no esté configurado, el workflow solo construye y comprueba que todo compila.
name: Publicar en Roblox

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: publish-roblox
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o -q rojo.zip -d "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Construir el juego
        run: rojo build -o ShooterRob.rbxlx

      - name: Publicar en Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ] || [ -z "$ROBLOX_UNIVERSE_ID" ] || [ -z "$ROBLOX_PLACE_ID" ]; then
            echo "::warning::Publicación no configurada: añade ROBLOX_API_KEY (secret) y ROBLOX_UNIVERSE_ID / ROBLOX_PLACE_ID (variables)."
            exit 0
          fi
          scripts/publish.sh ShooterRob.rbxlx

      - name: Guardar el archivo del juego
        uses: actions/upload-artifact@v4
        with:
          name: ShooterRob
          path: ShooterRob.rbxlx
